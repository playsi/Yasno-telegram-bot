name: Yasno Telegram Bot

on:
  schedule:
    # Не на :00 — у цю хвилину GitHub найчастіше затримує або пропускає запуски.
    - cron: "17 * * * *"
  workflow_dispatch:

# Два запуски одночасно конфліктували б при git push і могли б надіслати дублі.
concurrency:
  group: yasno-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REGION: ${{ secrets.REGION }}
          DSOS: ${{ secrets.DSOS }}
          GROUP: ${{ secrets.GROUP }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          QUIET_HOURS: ${{ vars.QUIET_HOURS }}
        run: python main.py

      # Зберігаємо дані навіть якщо бот впав посередині: він уже міг надіслати
      # повідомлення, і без збереження наступний запуск надіслав би їх ще раз.
      - name: Commit encrypted data
        if: success() || failure()
        run: |
          mkdir -p data
          git add bot_data.json data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "playsi"
          git config user.email "playsiproffesor@gmail.com"
          git commit -m "🔒 Update encrypted bot data"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          exit 1
